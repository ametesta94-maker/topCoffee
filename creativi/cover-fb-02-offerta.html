<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>TopCoffy — Facebook Cover #2 (820×312)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#1a0e08}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Inter',sans-serif}
  .canvas{
    width:820px;height:312px;position:relative;overflow:hidden;
    background:#faf5ec;color:#2a1810;
  }
  .canvas::before{
    content:"";position:absolute;inset:0;
    background-image:
      repeating-linear-gradient(45deg, rgba(201,169,97,.06) 0 2px, transparent 2px 14px);
  }
  .top-bar{position:absolute;top:0;left:0;right:0;height:38px;background:#2a1810;display:flex;align-items:center;justify-content:center;gap:24px;color:#faf5ec;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
  .top-bar .dot{width:5px;height:5px;border-radius:50%;background:#c9a961}
  .top-bar span{display:flex;align-items:center;gap:8px}
  .photo{
    position:absolute;right:0;top:38px;bottom:0;width:46%;
    background:url('../WhatsApp%20Image%202026-04-15%20at%2012.44.08.jpeg') center / cover no-repeat;
  }
  .photo::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg, #faf5ec 0%, transparent 30%);
  }
  .left{position:absolute;left:36px;top:60px;max-width:430px;z-index:2}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .brand .logo{width:48px;height:48px;border-radius:50%;background:#fff;padding:4px;box-shadow:0 4px 12px rgba(42,24,16,.15);border:1.5px solid #c9a961}
  .brand .logo img{width:100%;height:100%;object-fit:contain;border-radius:50%}
  .brand .name{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;font-style:italic;color:#2a1810;line-height:1}
  h1{font-family:'Playfair Display',serif;font-size:42px;font-weight:900;line-height:1;letter-spacing:-.5px;color:#2a1810}
  h1 em{color:#a88a47;font-style:italic;font-weight:700}
  .badge{display:inline-block;margin-top:14px;background:#2a1810;color:#c9a961;padding:9px 20px;border-radius:30px;font-size:12px;font-weight:900;letter-spacing:2px;text-transform:uppercase}
  .gift{
    position:absolute;right:30px;top:60px;
    width:120px;height:120px;border-radius:50%;
    background:linear-gradient(140deg,#c9a961,#a88a47);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 12px 30px rgba(42,24,16,.3), inset 0 -6px 12px rgba(0,0,0,.15);
    transform:rotate(8deg);border:3px solid #faf5ec;z-index:3;
  }
  .gift .small{font-size:10px;font-weight:900;letter-spacing:2px;color:#2a1810;text-transform:uppercase}
  .gift .big{font-family:'Playfair Display',serif;font-size:30px;font-weight:900;color:#2a1810;line-height:.9;font-style:italic}
  .gift .tag{font-size:9px;font-weight:700;letter-spacing:1.5px;color:#2a1810;text-transform:uppercase;margin-top:2px}
</style>
</head>
<body>
  <div class="canvas">
    <div class="top-bar">
      <span><span class="dot"></span>Made in Italy</span>
      <span><span class="dot"></span>Garanzia illimitata</span>
      <span><span class="dot"></span>Consegna gratuita</span>
    </div>
    <div class="photo"></div>
    <div class="gift">
      <span class="small">Macchina</span>
      <span class="big">GRATIS</span>
      <span class="tag">in regalo</span>
    </div>
    <div class="left">
      <div class="brand">
        <div class="logo"><img src="../WhatsApp%20Image%202026-04-15%20at%2012.44.07%20%285%29.jpeg" alt=""></div>
        <div class="name">TopCoffy</div>
      </div>
      <h1>Il caffè <em>artigianale</em><br>che ti viene a casa.</h1>
      <div class="badge">→ Degustazione gratuita</div>
    </div>
  </div>
</body>
</html>
