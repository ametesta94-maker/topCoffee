<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>TopCoffy — Facebook Cover #1 (820×312)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#1a0e08}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Inter',sans-serif}
  /* Facebook page cover desktop: 820×312 */
  .canvas{
    width:820px;height:312px;position:relative;overflow:hidden;
    background:
      linear-gradient(110deg, #2a1810 0%, #2a1810 48%, transparent 48%),
      url('../WhatsApp%20Image%202026-04-15%20at%2012.44.07%20%284%29.jpeg') right center / cover no-repeat,
      #3d2317;
    color:#faf5ec;
  }
  .canvas::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(110deg, transparent 30%, rgba(42,24,16,.55) 48%, transparent 70%);
  }
  .left{position:absolute;left:40px;top:50%;transform:translateY(-50%);max-width:380px;z-index:2}
  .brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .brand .logo{width:60px;height:60px;border-radius:50%;background:#faf5ec;padding:5px;box-shadow:0 6px 16px rgba(0,0,0,.3)}
  .brand .logo img{width:100%;height:100%;object-fit:contain;border-radius:50%}
  .brand .name{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;font-style:italic;line-height:1}
  .brand .name small{display:block;font-family:'Inter',sans-serif;font-size:9px;letter-spacing:3px;font-weight:600;font-style:normal;opacity:.7;text-transform:uppercase;margin-top:3px}
  h1{font-family:'Playfair Display',serif;font-size:38px;font-weight:900;line-height:1;letter-spacing:-.5px}
  h1 em{color:#c9a961;font-style:italic;font-weight:700}
  .tag{font-size:13px;line-height:1.4;margin-top:12px;opacity:.85;max-width:340px}
  .ribbon{position:absolute;right:-8px;top:30px;background:#c9a961;color:#2a1810;padding:8px 28px 8px 22px;font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;clip-path:polygon(0 0, 100% 0, 92% 50%, 100% 100%, 0 100%);z-index:3}
</style>
</head>
<body>
  <div class="canvas">
    <div class="left">
      <div class="brand">
        <div class="logo"><img src="../WhatsApp%20Image%202026-04-15%20at%2012.44.07%20%285%29.jpeg" alt=""></div>
        <div class="name">TopCoffy<small>Made in Italy</small></div>
      </div>
      <h1>Caffè artigianale,<br><em>direttamente a casa tua</em>.</h1>
      <p class="tag">Capsule da 8 grammi · Macchina in regalo · Consegna gratuita.</p>
    </div>
    <div class="ribbon">★ Dal 2010</div>
  </div>
</body>
</html>
